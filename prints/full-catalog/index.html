<body>

  <nav class="site-nav" aria-label="Main navigation">
    <div class="container">

        <li><a href="/cart/" class="nav-cart">Cart <span class="cart-count" id="cart-count">0</span></a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">
      <header class="page-header">
        <h1>Full Catalog</h1>
        <p>The complete body of work — over 140 pieces. All prints $30.</p>
        <p><a href="/prints/">&larr; Back to Prints</a></p>
      </header>
    </div>

      <div class="prints-grid" id="grid-all"></div>

  <script src="/js/cart.js"></script>
  <script>
  (function () {
    var GIFT_SLUGS = [
      'cayuga-i-am-six-nations','cayuga-hello-how-are-you','cayuga-i-love-you',
      'cayuga-i-understand','cayuga-lets-eat','cayuga-we-are-all-warriors',
      'cayuga-what-a-beautiful-day','cayuga-what-is-your-name'
    ];
    var SOLD_SLUGS = ['ancestral-faces','three-sachems','uncle'];

    fetch('/search.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var sorted = data.slice().sort(function (a, b) {
          return a.title.localeCompare(b.title);
        });
        var grid = document.getElementById('grid-all');
        grid.innerHTML = sorted.map(function (p) {
          var isGift = GIFT_SLUGS.indexOf(p.slug) !== -1;
          var isSold = SOLD_SLUGS.indexOf(p.slug) !== -1;
          var label = isSold ? 'Sold' : isGift ? 'View &rarr;' : 'Buy print &rarr;';
          return '<a href="/prints/' + p.slug + '/" class="work-card">'
            + '<div class="work-card-image">'
            + '<img src="/prints/' + p.slug + '/' + p.slug + '-thumb.jpg"'
            + ' alt="' + p.title + ' — digital artwork by Tom Myer"'
            + ' width="480" height="480" loading="lazy">'
            + '</div>'
            + '<div class="work-card-body">'
            + '<h3 class="work-card-title">' + p.title + '</h3>'
            + '<span class="work-card-link">' + label + '</span>'
            + '</div>'
            + '</a>';
        }).join('');
      });
  }());
  </script>
</body>
